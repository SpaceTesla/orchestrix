services:
  api:
    build: .

    env_file:
      - .env

    command: orchestrix api --reload

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

    volumes:
      - ./src:/app/src
      - ./tests:/app/tests

    networks:
      - app-network

  worker:
    build: .

    env_file:
      - .env

    command: orchestrix worker

    # Metrics on :9090 inside the container (no host port — avoids conflicts with --scale worker=N)
    expose:
      - "9090"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

    volumes:
      - ./src:/app/src

    networks:
      - app-network
