[project]
name = "orchestrix"
version = "0.1.0"
description = "A distributed, rate-limited job execution engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "annotated-types>=0.7.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.25.0",
    "pydantic-settings>=2.14.0",
    "redis[hiredis]>=7.4.0",
    "rich>=15.0.0",
    "structlog>=25.5.0",
    "uvicorn>=0.46.0",
]

[project.scripts]
orchestrix = "orchestrix.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrix"]
